AWSTemplateFormatVersion: "2010-09-09"
Description: Persistent On-Demand EC2 worker for occasional All-TMD trial sweeps.

Parameters:
  ProjectName:
    Type: String
    Default: all-tmd-v2
    AllowedPattern: "^[a-zA-Z0-9-]+$"
  InstanceType:
    Type: String
    Default: c7i.4xlarge
    AllowedValues:
      - c7i.4xlarge
      - c7i.8xlarge
      - m7i.4xlarge
  DataVolumeSizeGiB:
    Type: Number
    Default: 200
    MinValue: 150
  UbuntuImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  BucketName:
    Type: String
    Default: ""
    Description: Optional globally unique bucket name; leave blank for a generated name.
  CollectorSessionsBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: S3 bucket created by the transport data collector backend.
  CollectorSessionsTableName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{3,255}$"
    Description: DynamoDB session table created by the collector backend.
  NtfyTokenParameterName:
    Type: String
    Default: /all-tmd-v2/ntfy-token
    AllowedPattern: '^/[A-Za-z0-9_./-]+$'
  BudgetNotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Email address that receives the USD 50 monthly EC2 budget alert.

Conditions:
  HasExplicitBucketName: !Not [!Equals [!Ref BucketName, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw
        - Key: Project
          Value: !Ref ProjectName

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-worker
        - Key: Project
          Value: !Ref ProjectName

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public
        - Key: Project
          Value: !Ref ProjectName

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      RouteTableIds:
        - !Ref RouteTable
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      VpcId: !Ref Vpc

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No-ingress security group for the All-TMD SSM worker
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Package, container, SSM, ntfy, and AWS API access
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-no-ingress
        - Key: Project
          Value: !Ref ProjectName

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasExplicitBucketName, !Ref BucketName, !Ref AWS::NoValue]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AllTmdDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListProjectData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - all-tmd-v2/*
              - Sid: ReadInputsAndConfiguration
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub ${DataBucket.Arn}/all-tmd-v2/inputs/*
                  - !Sub ${DataBucket.Arn}/all-tmd-v2/config/*
              - Sid: QueryConfirmedCollectorSessions
                Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CollectorSessionsTableName}
                  - !Sub >-
                    arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CollectorSessionsTableName}/index/received-sync-index
              - Sid: ReadConfirmedCollectorPayloads
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:::${CollectorSessionsBucketName}/raw/*
              - Sid: WriteResults
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/all-tmd-v2/results/*
              - Sid: ReadNotificationToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NtfyTokenParameterName}
              - Sid: StopTaggedWorker
                Effect: Allow
                Action: ec2:StopInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Project: !Ref ProjectName
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WorkerRole

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Encrypted: true
      Iops: 3000
      Size: !Ref DataVolumeSizeGiB
      Throughput: 125
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-data
        - Key: Project
          Value: !Ref ProjectName

  WorkerInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - PublicSubnetRouteTableAssociation
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 24
            VolumeType: gp3
      IamInstanceProfile: !Ref WorkerInstanceProfile
      ImageId: !Ref UbuntuImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
      Monitoring: true
      SecurityGroupIds:
        - !Ref WorkerSecurityGroup
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-worker
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2 git jq curl unzip time
          if ! command -v aws >/dev/null 2>&1; then
              curl --fail --silent --show-error \
                  https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
                  --output /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install
          fi
          systemctl enable --now docker
          usermod -aG docker ubuntu
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service \
              2>/dev/null || true

          volume_id='${DataVolume}'
          expected_serial=$(printf '%s' "$volume_id" | tr -d -)
          device=
          for attempt in $(seq 1 120); do
              device=$(lsblk -dn -o NAME,SERIAL | \
                  awk -v serial="$expected_serial" '$2 == serial {print "/dev/" $1}')
              if [[ -n $device ]]; then
                  break
              fi
              sleep 5
          done
          if [[ -z $device ]]; then
              printf 'Data volume %s was not attached in time.\n' "$volume_id" >&2
              exit 1
          fi
          if ! blkid "$device" >/dev/null 2>&1; then
              mkfs.ext4 -L all-tmd-data "$device"
          fi
          uuid=$(blkid -s UUID -o value "$device")
          mkdir -p /mnt/all-tmd-data
          if ! grep -q "UUID=$uuid" /etc/fstab; then
              printf 'UUID=%s /mnt/all-tmd-data ext4 defaults,nofail 0 2\n' "$uuid" \
                  >>/etc/fstab
          fi
          mount /mnt/all-tmd-data
          chown ubuntu:ubuntu /mnt/all-tmd-data
          install -d -m 0755 /var/lib/all-tmd-v2
          date --iso-8601=seconds >/var/lib/all-tmd-v2/bootstrap-complete

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref WorkerInstance
      VolumeId: !Ref DataVolume

  MonthlyEc2Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: 50
          Unit: USD
        BudgetName: !Sub ${ProjectName}-ec2-monthly-50-usd
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon Elastic Compute Cloud - Compute
            - EC2 - Other
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetNotificationEmail
              SubscriptionType: EMAIL

Outputs:
  BucketName:
    Value: !Ref DataBucket
  CollectorSessionsBucketName:
    Value: !Ref CollectorSessionsBucketName
  CollectorSessionsTableName:
    Value: !Ref CollectorSessionsTableName
  DataVolumeId:
    Value: !Ref DataVolume
  InstanceId:
    Value: !Ref WorkerInstance
  NtfyTokenParameterName:
    Value: !Ref NtfyTokenParameterName
  Region:
    Value: !Ref AWS::Region
  ServiceName:
    Value: all-tmd-trials.service
