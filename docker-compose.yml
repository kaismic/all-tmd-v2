x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: tcct-all-tmd-v2:latest
  working_dir: /app
  environment:
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: /app
    NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
    NTFY_TOPIC: ${NTFY_TOPIC:-}
    NTFY_TOKEN: ${NTFY_TOKEN:-}
    NTFY_EVENTS: ${NTFY_EVENTS:-steps}
  volumes:
    - ${ALL_TMD_DATA_DIR:-./data}:/data

services:
  study:
    <<: *common
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5002}
      ALL_TMD_GIT_COMMIT: ${ALL_TMD_GIT_COMMIT:-unknown}
    volumes:
      - .:/app
      - ${ALL_TMD_DATA_DIR:-./data}:/data
      - ${ALL_TMD_MLFLOW_DATA_DIR:-./data/all-tmd-v2-mlflow}:/mlflow-data
    entrypoint: ["python", "-m", "all_tmd.study_cli"]

  dev:
    <<: *common
    volumes:
      - .:/app
      - ${ALL_TMD_DATA_DIR:-./data}:/data
    command: sleep infinity

  ingest-train-dataset:
    <<: *common
    profiles: ["ingest"]
    command:
      - python
      - -m
      - all_tmd.compose_task
      - --event
      - ingest-train-dataset
      - ingest-train-dataset-${ALL_TMD_TRIAL_INDEX:-0}
      - python
      - -m
      - all_tmd.cli
      - --trial-index
      - ${ALL_TMD_TRIAL_INDEX:-0}
      - ingest-train-dataset

  ingest-collector:
    <<: *common
    profiles: ["ingest"]
    command:
      - python
      - -m
      - all_tmd.compose_task
      - --event
      - ingest-collector
      - ingest-collector-${ALL_TMD_TRIAL_INDEX:-0}
      - python
      - -m
      - all_tmd.cli
      - --trial-index
      - ${ALL_TMD_TRIAL_INDEX:-0}
      - ingest-collector

  features:
    <<: *common
    profiles: ["features"]
    command:
      - python
      - -m
      - all_tmd.compose_task
      - --event
      - features
      - features-${ALL_TMD_TRIAL_INDEX:-0}
      - python
      - -m
      - all_tmd.cli
      - --trial-index
      - ${ALL_TMD_TRIAL_INDEX:-0}
      - features

  train:
    <<: *common
    profiles: ["train"]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_EVENTS: ${NTFY_EVENTS:-steps}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5002}
    volumes:
      - ${ALL_TMD_DATA_DIR:-./data}:/data
      - ${ALL_TMD_MLFLOW_DATA_DIR:-./data/all-tmd-v2-mlflow}:/mlflow-data
    command:
      - python
      - -m
      - all_tmd.compose_task
      - --event
      - train
      - train-${ALL_TMD_TRIAL_INDEX:-0}
      - python
      - -m
      - all_tmd.cli
      - --trial-index
      - ${ALL_TMD_TRIAL_INDEX:-0}
      - train

  notify:
    <<: *common
    profiles: ["notifications"]
    entrypoint:
      - python
      - -m
      - all_tmd.notifications

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2
    profiles: ["mlflow"]
    ports:
      - "5002:5002"
    volumes:
      - ${ALL_TMD_DATA_DIR:-./data}:/data
      - ${ALL_TMD_MLFLOW_DATA_DIR:-./data/all-tmd-v2-mlflow}:/mlflow-data
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5002"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow-data/mlflow.db}
      - --artifacts-destination
      - ${MLFLOW_ARTIFACTS_DESTINATION:-/mlflow-data/mlartifacts}
      - --allowed-hosts
      - mlflow:5002,localhost:*,127.0.0.1:*
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
