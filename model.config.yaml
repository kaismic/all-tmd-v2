schema_version: 1

sources:
  nor-tmd:
    input_dir: /data/nor-tmd-data
    include_globs:
      - "**/*.csv"
    chunk_rows: 50000
  us-tmd:
    input_dir: /data/us-tmd-data
    include_globs:
      - "**/*.csv"
    chunk_rows: 50000
  collector:
    input_dir: /data/downloaded_sessions
    include_globs:
      - "**/*.json"
      - "**/*.json.gz"

dataset:
  work_dir: /data/all-tmd-v2-work
  minimum_trip_seconds: 30
  maximum_trip_seconds: 7200
  collector_max_sample_interval_ms: 500
  input_manifest_digest: "8931f5b287838320e9173639d4023da19f34271b6b8abdfdc63691102674124c"
  snapshot_manifest: /app/manifests/sydney-166.json

collector_minimum_sampling_rate: # hz
  accelerometer: 30
  gyroscope: 4
  magnetometer: 2
  pressure: 2

training:
  n_jobs: -1
  timeout_seconds: null
  xgboost_device: "cpu"

mlflow:
  enabled: true
  experiment_name: ALL-TMD-V2 Sydney Transfer
  tracking_uri: null
  artifact_location: null
