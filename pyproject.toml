[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "all-tmd-v2"
version = "0.2.0"
description = "Controlled NOR-TMD to Sydney transport-mode transfer study."
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.5.0",
  "pandas>=2.3.3,<3",
  "pyarrow>=24.0.0",
  "numpy>=2.5.1",
  "scipy>=1.18.0",
  "scikit-learn>=1.9.0",
  "xgboost>=3.3.0",
  "optuna>=4.9.0",
  "mlflow>=3.15.2",
  "matplotlib>=3.10.0",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
deployment = [
  "onnx>=1.19.0",
  "onnxruntime>=1.23.0",
  "onnxmltools>=1.14.0",
  "skl2onnx>=1.19.0",
]
test = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["all_tmd*"]
